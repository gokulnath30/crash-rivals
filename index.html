<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Arcade — browser games with friends</title>
    <meta
      name="description"
      content="A small shelf of browser games you play with friends. Sign in with Google, open a room, send the link."
    />
    <meta name="theme-color" content="#0b0718" />

    <!--
      Installable as an app. The manifest carries the name, the icons and the
      display mode; `sw.js` is what actually makes the browser offer to
      install, because Chrome requires a service worker that handles `fetch`.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />

    <!--
      iPhone and iPad ignore the manifest almost entirely: the home-screen
      icon, the standalone display mode and the status bar all come from these
      instead. Without them, "Add to Home Screen" makes a Safari bookmark
      rather than something that opens like an app.
    -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arcade" />

    <!--
      Fonts are the one external stylesheet here. Preconnect so the display
      face is not the last thing to arrive, and `display=swap` so the page is
      readable while it does.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font: 16px/1.6 system-ui; color: #efe7ff">
        These are 3D browser games, so they need JavaScript switched on.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
